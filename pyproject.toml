[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tnorma"
dynamic = ["version"]
description = "Temporal normalization (from 0 to 100% with step interval)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Duarte", email = "duartexyz@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
keywords = ["temporal normalization", "time normalization", "percent cycle", "interpolation", "biomechanics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/demotu/tnorma"
Documentation = "https://github.com/demotu/tnorma/tree/master/docs"
Issues = "https://github.com/demotu/tnorma/issues"

[tool.setuptools]
packages = ["tnorma"]

[tool.setuptools.dynamic]
version = { attr = "tnorma.__version__" }

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:tnorma", "ignore:.*non-interactive:UserWarning"]
